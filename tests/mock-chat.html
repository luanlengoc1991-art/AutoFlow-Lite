<!doctype html>
<html><head><meta charset="utf-8"><title>Mock Chat</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #212121; color: #eee; }
  #thread { padding: 16px 16px 160px; display: flex; flex-direction: column; gap: 12px; }
  #thread { list-style: none; margin: 0; }
  [data-message-role="user"] { align-self: flex-end; background: #333; padding: 8px 12px; border-radius: 12px; }
  [data-message-role="assistant"] { padding: 8px 0; }
  [data-assistant-markdown-root] { white-space: pre-wrap; }
  [data-message-role="assistant"] img { width: 300px; height: 225px; display: block; }
  form { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: 640px; background: #2f2f2f; border-radius: 20px; padding: 10px; }
  #previews img { width: 48px; height: 48px; }
  #mobile-composer-prompt { width: 100%; min-height: 24px; outline: none; background: transparent; color: #eee; border: 0; resize: none; font: inherit; }
  button { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 6px 12px; }
  button:disabled { opacity: .3; }
</style></head>
<body>
<ol id="thread" aria-label="Conversation" data-conversation-transcript></ol>
<form onsubmit="return false">
  <div id="previews"></div>
  <input type="file" multiple accept="image/*" style="display:none" id="upload">
  <textarea id="mobile-composer-prompt" aria-label="Chat with ChatGPT" placeholder="Ask anything"></textarea>
  <div style="display:flex;justify-content:flex-end;margin-top:6px"><button aria-label="Add files and more" type="button">+</button><button id="send" disabled aria-label="Send message">↑</button></div>
</form>
<script>
  // Giả lập ChatGPT (giao diện "octane" 2026, đo trên chatgpt.com): composer textarea, li[data-message-role], nút gửi/dừng, câu trả lời stream từng chữ, ảnh khi được yêu cầu vẽ.
  window.chatMock = { sent: [] };
  const box = document.getElementById('mobile-composer-prompt');
  const send = document.getElementById('send');
  const thread = document.getElementById('thread');
  const upload = document.getElementById('upload');
  let attachments = 0;
  const refresh = () => { send.disabled = !box.value.trim(); };
  box.addEventListener('input', refresh);
  upload.addEventListener('change', () => {
    for (const f of upload.files) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      document.getElementById('previews').appendChild(img);
      attachments++;
    }
  });
  function reply(text, files = []) {
    const user = document.createElement('li');
    user.setAttribute('data-message-role', 'user');
    user.innerHTML = '<div data-user-message-bubble><p data-user-message-copy></p></div>';
    user.querySelector('p').textContent = text;
    // Ảnh đính kèm hiện lại trong tin nhắn người dùng (to như ChatGPT thật).
    for (const src of files) { const im = document.createElement('img'); im.src = src; im.style.cssText = 'width:200px;height:200px;display:block'; user.prepend(im); }
    thread.appendChild(user);
    const bot = document.createElement('li');
    bot.setAttribute('data-message-role', 'assistant');
    bot.innerHTML = '<h6 style="display:none">ChatGPT said:</h6><div data-assistant-markdown data-assistant-markdown-root><section aria-label="DIL content"><p data-d-component="text"></p></section></div>';
    thread.appendChild(bot);
    // "strangeui": giao diện lạ — tin nhắn không có thuộc tính / class nào mà AutoFlow biết.
    if (/strangeui/i.test(text)) {
      user.removeAttribute('data-message-role');
      user.innerHTML = '<div><p></p></div>'; user.querySelector('p').textContent = text;
      bot.removeAttribute('data-message-role');
      bot.innerHTML = '<div><div><p></p></div></div>';
    }
    const md = bot.querySelector('p');
    const stop = document.createElement('button');
    stop.setAttribute('aria-label', 'Stop generating');
    // "vnui": giống bản đăng nhập tiếng Việt: nút "Ngừng", khung trả lời không có thuộc tính nhận dạng.
    if (/vnui/i.test(text)) { stop.setAttribute('aria-label', 'Ngừng'); bot.removeAttribute('data-message-role'); }
    stop.textContent = '■';
    send.replaceWith(stop);
    let answer;
    const m = /Write (\d+) distinct/.exec(text);
    const json = /Return ONLY a JSON array/.test(text);
    const nJson = +(/exactly (\d+) scenes/.exec(text)?.[1] || 3);
    if (json) answer = JSON.stringify(Array.from({ length: nJson }, (_, i) => ({ title: `Cảnh ${i + 1}`, prompt: `Scene ${i + 1}: a cinematic shot of the story`, voiceover: `Lời thoại ${i + 1}` })));
    else if (/storyboard/i.test(text)) {
      const scenes = +(/Số cảnh:\s*(\d+)/.exec(text)?.[1] || 2);
      answer = Array.from({ length: scenes }, (_, i) => { const k = String(i + 1).padStart(2, '0'); return `[image_prompt_${k}] Caveman scene ${k} still image\n[video_prompt_${k}] Caveman scene ${k} slow camera pan`; }).join('\n');
    }
    else if (m) answer = Array.from({ length: +m[1] }, (_, i) => `${i + 1}. A cinematic shot number ${i + 1} of the idea`).join('\n');
    else if (/^(draw|generate an image)/i.test(text)) answer = 'Creating image';
    else if (/refuse/i.test(text)) answer = "I can't create that image because it may violate our content policy.";
    else answer = `Here is my answer about: ${text}`;
    // Stream theo 5 cụm (tab nền bị giảm tần suất timer nên không stream từng chữ).
    const words = answer.split(/(\s+)/);
    const chunk = Math.ceil(words.length / 5);
    let i = 0;
    const timer = setInterval(() => {
      md.textContent += words.slice(i, i + chunk).join('');
      i += chunk;
      if (i < words.length) return;
      clearInterval(timer);
      // "outside": ảnh nằm ngoài khối câu trả lời; "stuckstop": nút Dừng không biến mất.
      const done = () => { bot.setAttribute('data-message-complete', ''); if (!/stuckstop/i.test(text)) stop.replaceWith(send); else document.body.appendChild(send); box.value = ''; refresh(); };
      if (answer === 'Creating image' && files.length) {
        // Sửa ảnh: ChatGPT hiện ảnh gốc làm nền trong lúc vẽ (cùng nội dung nhưng URL blob: mới),
        // không có nút Dừng, rồi mới thay bằng ảnh mới.
        stop.replaceWith(send);
        const ph = document.createElement('img');
        fetch(files[0]).then((r) => r.blob()).then((b) => { ph.src = URL.createObjectURL(b); });
        bot.appendChild(ph);
        setTimeout(() => {
          ph.remove();
          md.textContent = 'Image edited';
          const img = document.createElement('img');
          img.src = `/asb/chatedit${Date.now()}=w400`;
          bot.appendChild(img);
          bot.setAttribute('data-message-complete', '');
          box.value = ''; refresh();
        }, 4000);
      } else if (answer === 'Creating image') {
        setTimeout(() => {
          md.textContent = 'Image created';
          const img = document.createElement('img');
          img.src = `/asb/chatimg${Date.now()}=w400`;
          if (/outside/i.test(text)) { const wrap = document.createElement('div'); wrap.appendChild(img); thread.appendChild(wrap); } else bot.appendChild(img);
          done();
        }, 1500);
      } else done();
    }, 60);
  }
  send.addEventListener('click', () => {
    const text = box.value.trim();
    if (!text) return;
    window.chatMock.sent.push({ text, attachments });
    const files = [...document.querySelectorAll('#previews img')].map((i) => i.src);
    box.value = '';
    attachments = 0;
    document.getElementById('previews').innerHTML = '';
    reply(text, files);
  });
</script>
</body></html>
