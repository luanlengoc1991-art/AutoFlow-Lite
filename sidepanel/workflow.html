<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Editor · AutoFlow</title>
  <link rel="stylesheet" href="workflow.css">
</head>
<body>
  <div id="canvas">
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <header class="top">
    <input id="wf-title" class="wf-title" type="text" spellcheck="false">
    <button class="tog on" id="wf-enabled" title="Bật/tắt workflow"></button>
    <span class="save-state" id="save-state"></span>
    <span class="spacer"></span>
    <span class="stat" title="Số lần chạy hôm nay"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Runs <b id="stat-runs">0</b></span>
    <span class="dotsep">•</span>
    <span class="stat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6"/></svg>Nodes <b id="stat-nodes">0</b></span>
    <label class="speed" title="Chạy song song tối đa 3 task Flow"><button class="tog sm" id="max-speed"></button>Max Speed <span class="v2">v2</span></label>
    <button class="btn-ghost" id="btn-reset" title="Xoá kết quả & trạng thái chạy trên canvas"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8M3 3v5h5"/></svg>Reset</button>
    <button class="btn-white" id="btn-save">Lưu</button>
    <button class="btn-lime" id="btn-saveas" title="Lưu thành workflow mới"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Lưu bản sao</button>
    <button class="icon-btn" id="btn-share" title="Chia sẻ (xuất file .json)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
    <button class="icon-btn" id="btn-close" title="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>

  <div class="brand"><span class="logo">✦</span>AutoFlow <span class="badge-free">LITE</span></div>

  <nav class="toolbar" id="toolbar">
    <button class="tb add" data-act="add" data-tip="Thêm node (N)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tb active" data-tool="select" data-tip="Chọn (V)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
    <button class="tb" data-tool="hand" data-tip="Kéo canvas (H / giữ Space)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 013 0V12M11 11V4.5a1.5 1.5 0 013 0V12M14 11.5V6a1.5 1.5 0 013 0v8a7 7 0 01-7 7h-.5a6 6 0 01-4.6-2.2L3.3 15a1.5 1.5 0 012.2-2L8 15"/></svg></button>
    <div class="sep"></div>
    <button class="tb" data-act="note" data-tip="Thêm ghi chú (khung group)"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.75 2.6v2c0 1.3 0 1.9.2 2.4.2.4.6.8 1 1 .5.2 1.1.2 2.4.2h2M15.75 9.7v2.5c0 1.2 0 1.9-.25 2.3-.2.4-.6.8-1 1-.4.2-1.1.2-2.3.2H5.85c-1.2 0-1.9 0-2.3-.2-.4-.2-.8-.6-1-1-.3-.4-.3-1.1-.3-2.3V5.85c0-1.2 0-1.9.3-2.3.2-.4.6-.8 1-1 .4-.3 1.1-.3 2.3-.3h2.4c.6 0 .8 0 1.1.1.2.1.4.1.6.3.2.1.4.3.8.7l3.9 3.9c.4.4.6.6.7.8.1.2.2.4.3.7.1.2.1.5.1 1z"/></svg></button>
    <button class="tb" data-act="library" data-tip="Thêm media từ thư viện"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h7M16 5h6M19 2v6"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.1-3.1a2 2 0 00-2.8 0L6 21"/></svg></button>
    <button class="tb run" data-act="run" id="tb-run" data-tip="Chạy workflow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <div class="sep"></div>
    <button class="tb" data-act="undo" id="tb-undo" data-tip="Hoàn tác (Ctrl+Z)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
    <button class="tb" data-act="redo" id="tb-redo" data-tip="Làm lại (Ctrl+Shift+Z)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    <div class="sep"></div>
    <button class="tb" data-act="refresh" data-tip="Refresh"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0115.5-6.4L21 8M21 3v5h-5M21 12a9 9 0 01-15.5 6.4L3 16M3 21v-5h5"/></svg></button>
    <button class="tb" data-act="search" data-tip="Tìm node (Ctrl+F)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="tb" data-act="arrange" data-tip="Sắp xếp lại nodes"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
    <button class="tb" data-act="settings" data-tip="Cài đặt workflow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </nav>

  <div class="zoombar">
    <button class="icon-btn" id="zoom-in" title="Phóng to"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6M11 8v6"/></svg></button>
    <span id="zoom-val">100%</span>
    <button class="icon-btn" id="zoom-out" title="Thu nhỏ"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6"/></svg></button>
    <button class="icon-btn" id="zoom-reset" title="Về 100%"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8M3 3v5h5"/></svg></button>
    <button class="icon-btn" id="btn-log" title="Log & tiến độ"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></button>
    <button class="icon-btn" id="btn-export" title="Xuất workflow (.json)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></button>
    <button class="icon-btn" id="btn-import" title="Nhập workflow (.json)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></svg></button>
    <input type="file" id="import-pick" accept=".json,application/json" hidden>
  </div>
  <aside class="logpanel" id="logpanel" hidden></aside>
  <button class="center-btn" id="btn-center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/><circle cx="12" cy="12" r="3"/></svg>Căn giữa</button>

  <aside class="side" id="side" hidden></aside>
  <input type="file" id="file-pick" accept="image/*,video/*" multiple hidden>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="workflow-editor.js"></script>
</body>
</html>
